name: CamHub CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python syntax
        run: python -m py_compile app.py
      - name: Validate config JSON
        run: python -m json.tool config.example.json > /dev/null
