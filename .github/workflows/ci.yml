name: CamHub CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python syntax
        run: python -m py_compile app.py
      - name: Check undefined Python names
        run: |
          pip install pyflakes
          pyflakes app.py > /tmp/pyflakes.txt || true
          cat /tmp/pyflakes.txt
          if grep -q "undefined name" /tmp/pyflakes.txt; then
            exit 1
          fi
      - name: Validate config JSON
        run: python -m json.tool config.example.json > /dev/null
      - name: Validate dashboard JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("web/dashboard.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          if not scripts:
              raise SystemExit("No dashboard script found")
          Path("/tmp/dashboard.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/dashboard.js
